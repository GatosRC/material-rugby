<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Material Rugby</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: Arial, sans-serif; max-width: 480px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 20px; }
  nav { display:flex; gap:8px; margin-bottom:16px; }
  nav button { flex:1; padding:10px; border:1px solid #999; background:transparent; border-radius:6px; cursor:pointer; }
  nav button.active { background:#38761d; color:white; border-color:#38761d; }
  section { display:none; }
  section.active { display:block; }
  label { display:block; margin-top:12px; font-weight:bold; font-size:14px; }
  select, input { width:100%; padding:8px; margin-top:4px; box-sizing:border-box; font-size:16px; }
  button.submit { margin-top:18px; width:100%; padding:12px; background:#38761d; color:white; border:none; border-radius:6px; font-size:15px; }
  #msg { margin-top:10px; font-size:13px; }
  table { width:100%; border-collapse:collapse; margin-top:12px; font-size:13px; }
  th, td { text-align:left; padding:6px; border-bottom:1px solid #ccc; }
  tr.falta { background:#f4cccc; color:#000; }
  p.ayuda { font-size:13px; color:#666; }
</style>
</head>
<body>
  <h1>🏉 Material Rugby</h1>

  <nav>
    <button id="tabRegistrar" class="active" onclick="mostrarTab('registrar')">Registrar conteo</button>
    <button id="tabResumen" onclick="mostrarTab('resumen')">Resumen</button>
  </nav>

  <section id="registrar" class="active">
    <p class="ayuda">Cuenta el material al terminar el entrenamiento (martes/jueves) y regístralo aquí.</p>

    <label>Entrenador</label>
    <input list="listaEntrenadores" id="entrenador" placeholder="Escribe tu nombre">
    <datalist id="listaEntrenadores"></datalist>

    <label>Item</label>
    <select id="item"></select>

    <label>Cantidad contada</label>
    <input type="number" id="cantidad" min="0" value="0">

    <button class="submit" onclick="enviar()">Registrar</button>
    <div id="msg"></div>
  </section>

  <section id="resumen">
    <p class="ayuda">Lo resaltado en rojo es material que falta según el último conteo.</p>
    <button class="submit" onclick="cargarResumen()">Actualizar</button>
    <table id="tablaResumen">
      <thead>
        <tr><th>Item</th><th>Total</th><th>Último</th><th>Fecha</th><th>Estado</th></tr>
      </thead>
      <tbody></tbody>
    </table>
  </section>

<script>
  const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxXP-lLoYvyRcpwLVHM3-n_DdQX0PBq1612cPumCIAyDSoAoLcGyvMwYx_B72BMB18yLQ/exec';

  function mostrarTab(nombre) {
    document.querySelectorAll('section').forEach(s => s.classList.remove('active'));
    document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
    document.getElementById(nombre).classList.add('active');
    document.getElementById('tab' + nombre.charAt(0).toUpperCase() + nombre.slice(1)).classList.add('active');
    if (nombre === 'resumen') cargarResumen();
  }

  function cargarItems() {
    fetch(SCRIPT_URL + '?action=items')
      .then(r => r.json())
      .then(items => {
        const sel = document.getElementById('item');
        sel.innerHTML = '';
        items.forEach(i => {
          const opt = document.createElement('option');
          opt.value = i; opt.textContent = i;
          sel.appendChild(opt);
        });
      });
  }

  function cargarEntrenadores() {
    fetch(SCRIPT_URL + '?action=entrenadores')
      .then(r => r.json())
      .then(names => {
        const dl = document.getElementById('listaEntrenadores');
        dl.innerHTML = '';
        names.forEach(n => {
          const opt = document.createElement('option');
          opt.value = n;
          dl.appendChild(opt);
        });
      });
  }

  function cargarResumen() {
    fetch(SCRIPT_URL + '?action=resumen')
      .then(r => r.json())
      .then(rows => {
        const tbody = document.querySelector('#tablaResumen tbody');
        tbody.innerHTML = '';
        rows.forEach(row => {
          const tr = document.createElement('tr');
          if (row.diferencia > 0) tr.classList.add('falta');
          tr.innerHTML = `<td>${row.item}</td><td>${row.total}</td><td>${row.ultimo}</td><td>${row.fecha}</td><td>${row.estado}</td>`;
          tbody.appendChild(tr);
        });
      });
  }

  function enviar() {
    const entrenador = document.getElementById('entrenador').value;
    const item = document.getElementById('item').value;
    const cantidad = document.getElementById('cantidad').value;
    const msg = document.getElementById('msg');
    if (!entrenador || !item || cantidad === '') {
      msg.textContent = 'Completa todos los campos.';
      return;
    }
    msg.textContent = 'Enviando...';
    fetch(SCRIPT_URL, {
      method: 'POST',
      body: JSON.stringify({ entrenador, item, cantidad })
    })
      .then(r => r.json())
      .then(res => {
        msg.textContent = res.ok ? res.mensaje : ('Error: ' + res.error);
      })
      .catch(err => { msg.textContent = 'Error de conexión: ' + err; });
  }

  cargarItems();
  cargarEntrenadores();
</script>
</body>
</html>
